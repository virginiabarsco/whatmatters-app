* { box-sizing: border-box; }

.pedidos .pedmsg { font-style: italic; }
.pedasig { display: grid; gap: 8px; margin-top: 4px; }
select, textarea { font: inherit; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
details.otros summary { cursor: pointer; list-style-position: inside; }
.seedst .xlink { font-size: 14px; text-align: right; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); }
.toast.err { background: var(--danger); color: #FFFFFF; }

/* ---- Estética WhatMatters: grilla de fondo, paneles con esquinas cortadas, acentos de luz ---- */

h1 { font-weight: 600; letter-spacing: .01em; }
h2 { font-weight: 600; letter-spacing: .02em; }
.card { border-radius: 0; border-color: var(--edge); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
.card > h2:first-child::before { content: ''; display: inline-block; width: 9px; height: 11px; margin-right: 9px; background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); vertical-align: 1px; }
button { border-radius: 2px; border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 600; letter-spacing: .05em; box-shadow: var(--glow); }
button.ghost, .pick button, .lme { background: transparent; color: var(--ink); border-color: var(--edge); box-shadow: none; font-family: var(--body); font-weight: 700; letter-spacing: 0; }
button.link, .xlink, .pname, .fold, .sres button, .tabs button, .lfilt button, .tool, .tcard, .tbar, .chip, .sadd { box-shadow: none; font-family: var(--body); letter-spacing: 0; }
.xlink { color: var(--accent); }
.chip { border-radius: 2px; border-color: var(--edge); }
input, select, textarea { border-radius: 2px; border-color: var(--edge); background: color-mix(in srgb, var(--bg) 75%, var(--surface)); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 1px var(--accent), var(--glow); }
.triad, .tree-wrap, .map, .sheet-wrap, .sres, .tbar, .tcard, .tabs, .lfilt, .tool, .pick { border-radius: 3px; }
.map, .sheet-wrap, .tabs, .lfilt { border-color: var(--edge); }
.tabs button[aria-selected="true"], .lfilt button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tcard { border-color: var(--edge); }
.tcard.cur { border: 2px solid var(--accent); box-shadow: var(--glow); }
.tag { border-radius: 2px; }
.tag.arbol { color: var(--leaf); }
.tag.semilla { color: var(--sap); }
.plant { border-radius: 2px; box-shadow: none; font-family: var(--body); letter-spacing: 0; }
.welcome details summary { color: var(--accent); }
.alc-head { border-bottom-color: var(--accent); }
details.otros { background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent); border-radius: 0; box-shadow: var(--glow); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
details.otros > summary { color: var(--accent); }
details.otros .otit { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 16px; color: var(--ink); }
details.otros .obody { border: 0; border-top: 1px solid var(--accent); border-radius: 0; }
.toast { border-radius: 2px; background: var(--surface); color: var(--ink); border: 1px solid var(--accent); box-shadow: var(--glow); }
.top { flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; }
button.brand { background: none; border: 0; box-shadow: none; padding: 0; min-height: 0; border-radius: 0; color: var(--ink); font-family: inherit; font-weight: inherit; cursor: pointer; clip-path: none; }
.hero .lema { margin: 8px 0 0; max-width: 100%; text-align: center; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.35; letter-spacing: .01em; color: var(--ink); }
.lema br.m { display: none; }
@media (max-width: 560px) { .lema br.m { display: inline; } }
.puertas { display: grid; gap: 8px; margin-top: 4px; }
.puertas button { width: 100%; text-align: left; font-size: 16px; min-height: 46px; padding: 11px 14px; }
.cifras { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.cifras b { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--ink); margin-right: 4px; }
#msvg .lbl.pid { font-size: 9.5px; font-weight: 400; fill: var(--ink); }
.wm { font-family: var(--display); font-weight: 600; letter-spacing: .16em; color: var(--ink); text-transform: uppercase; }
.wm .o { color: var(--wm-o); font-weight: 600; } .wm .c { color: var(--wm-c); font-weight: 600; }
.brand .wm { font-size: 14px; }
svg.wmlogo .o { stroke: var(--wm-o); } svg.wmlogo .c { stroke: var(--wm-c); } svg.wmlogo .k { stroke: var(--wm-k); opacity: .85; }
svg.wmlogo .f { fill: var(--accent); stroke: none; }
svg.wmlogo line { stroke-linecap: round; }
#modo { display: inline-flex; align-items: center; gap: 6px; }
#modo svg { flex: none; }
@media (max-width: 480px) { #modo .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } #modo { min-height: 32px; padding: 4px 9px; } }
.hero { position: relative; display: grid; justify-items: center; gap: 6px; padding: 26px 16px 22px; background: var(--hero); border: 1px solid var(--edge); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
.hero svg { width: 150px; height: 150px; cursor: pointer; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent)); }
.hero .wm { font-size: 34px; letter-spacing: .2em; text-align: center; }
.hero .hsub { text-transform: uppercase; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: .5em; color: var(--muted); padding-left: .5em; }
@media (max-width: 420px) { .hero .wm { font-size: 27px; letter-spacing: .12em; } .hero .hsub { font-size: 13px; letter-spacing: .4em; } }
/* Las tríadas del fondo usan los mismos colores que los alcances del mapa. */
.wmbg polygon.t0, .wmbg polygon.t1, .wmbg polygon.t2, .wmbg polygon.t3, .wmbg polygon.t4 { fill: var(--c); stroke: var(--c); }
.wmbg circle.t0, .wmbg circle.t1, .wmbg circle.t2, .wmbg circle.t3, .wmbg circle.t4 { fill: var(--c); }
.wmbg .t0 { --c: var(--s1); } .wmbg .t1 { --c: var(--s2); } .wmbg .t2 { --c: var(--s3); } .wmbg .t3 { --c: var(--s4); } .wmbg .t4 { --c: var(--s5); }
html { background-color: var(--m-water); }
body { background: transparent; }
.wmbg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.wmbg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wrap { position: relative; z-index: 1; }
/* El texto va directo sobre el mapa: sin tarjetas, con una línea de color entre secciones. */
.card { background: none; border: 0; clip-path: none; padding: 14px 0 0; border-top: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.hero { background: none; border: 0; clip-path: none; padding: 10px 0 18px; }
.tema .prop { background: color-mix(in srgb, var(--surface) 62%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.wrap { text-shadow: 0 1px 3px var(--m-land), 0 0 12px var(--m-land); }
button, input, select, textarea, .tcard, .tbar, .tabs, .lfilt, .tool, .chip, .sres, .map, .sheet-wrap, details.otros, .triad, .pick { text-shadow: none; }
.tcard, .tbar, .tabs, .lfilt, .tool, .chip, .sres, .triad, .pick { background: color-mix(in srgb, var(--surface) 78%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.tabs button, .lfilt button { background: none; }
.tabs button[aria-selected="true"], .lfilt button[aria-pressed="true"] { background: var(--accent); }
input, select, textarea { background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
details.otros .obody { background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
</style>

  Array.prototype.forEach.call(document.querySelectorAll('[data-quitar-no]'), function (b) { b.onclick = function () { QCONF = null; mcard(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-quitar-ok]'), function (b) {
    b.onclick = function () {
      if (BUSY) return; busy(true); var pos = b.getAttribute('data-quitar-ok');
      call('quitarPersona', TOKEN, ARBOL, pos).then(function () { busy(false); QCONF = null; MSEL = null; LAST_STATE = ''; toast('Listo, P' + pos + ' quedó por convocar'); return load(); }).catch(function (err) { busy(false); QCONF = null; toast(errMsg(err), true); mcard(); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-lfilt]'), function (b) { b.onclick = function () { LFILT = b.getAttribute('data-lfilt'); lsSet('wm_lfilt', LFILT); render(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-openinv]'), function (btn) {
    btn.onclick = function () {
      var slot = btn.getAttribute('data-openinv'), td = btn.parentNode;
      td.innerHTML = '<form class="inv sinvf" data-inv="' + slot + '"><input type="email" placeholder="Correo" aria-label="Correo para la posición ' + slot + '" required><button type="submit">Convocar</button></form>';
      bind(); var i = td.querySelector('input'); if (i) i.focus();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('form[data-inv]'), function (f) {
    f.onsubmit = function (e) {
      e.preventDefault(); if (BUSY) return; busy(true);
      call('invitar', TOKEN, ARBOL, f.getAttribute('data-inv'), f.querySelector('input').value).then(function () { busy(false); toast('Convocatoria enviada por correo'); return load(); }).catch(function (err) { busy(false); toast(errMsg(err), true); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-cancel]'), function (b) {
    b.onclick = function () { if (BUSY) return; busy(true); call('cancelarInvitacion', TOKEN, ARBOL, b.getAttribute('data-cancel')).then(function () { busy(false); toast('Convocatoria cancelada'); return load(); }).catch(function (err) { busy(false); toast(errMsg(err), true); }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tree]'), function (b) { b.onclick = function () { var id = b.getAttribute('data-tree'); switchTree(id).then(function () { var m = $('.tabs'); if (m) m.scrollIntoView({ block: 'start', behavior: 'smooth' }); }); }; });
  Array.prototype.forEach.call(document.querySelectorAll('details.otros'), function (od) { od.ontoggle = function () { OTROS = od.open; }; });
  var tq = $('#tq');
  if (tq) tq.oninput = function () {
    var t = normTxt(tq.value.trim()), n = 0;
    Array.prototype.forEach.call(document.querySelectorAll('#tlistAll .titem'), function (it) { var ok = !t || it.getAttribute('data-q').indexOf(t) >= 0; it.hidden = !ok; if (ok) n++; });
    var none = $('#tqNone'); if (none) none.hidden = n > 0;
  };
  var ss = $('#sumarSi'); if (ss) ss.onclick = function () { SUMAR = true; render(); var i = $('#sNombre') || $('#sMsg'); if (i) i.focus(); };
  var sn = $('#sumarNo'); if (sn) sn.onclick = function () { SUMAR = false; render(); };
  var sf = $('#sumarForm');
  if (sf) sf.onsubmit = function (e) {
    e.preventDefault(); if (BUSY) return; busy(true);
    var v = function (id) { var x = $(id); return x ? x.value : ''; };
    call('pedirSumarme', TOKEN, ARBOL, v('#sNombre'), v('#sCorreo'), v('#sLoQueImporta'), v('#sMsg')).then(function (res) {
      busy(false); SUMAR = false; LAST_STATE = '';
      toast(res.confirmar ? 'Te mandamos un correo: con su botón se confirma el pedido.' : 'Listo: el pedido llegó a la persona 1 del árbol.');
      return load();
    }).catch(function (err) { busy(false); toast(errMsg(err), true); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('select[data-pedsel]'), function (sel) {
    sel.onchange = function () { var o = sel.options[sel.selectedIndex], b = document.querySelector('[data-pedok="' + sel.getAttribute('data-pedsel') + '"]'); if (b) b.textContent = o.getAttribute('data-dueno') === '1' ? 'Convocar' : 'Proponer esta posición'; };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pedok]'), function (b) {
    b.onclick = function () {
      if (BUSY) return; var id = b.getAttribute('data-pedok'), sel = document.querySelector('select[data-pedsel="' + id + '"]'); busy(true);
      call('asignarPedido', TOKEN, id, sel ? sel.value : '').then(function (res) { busy(false); LAST_STATE = ''; toast(res.invitada ? 'Convocatoria enviada por correo.' : 'Listo: ' + (res.dueno || 'la persona') + ' recibe el aviso para convocar.'); return load(); }).catch(function (err) { busy(false); toast(errMsg(err), true); });
    };
  });
  [['data-pedinv', 'invitarPedido', 'Convocatoria enviada por correo.'], ['data-peddev', 'devolverPedido', 'El pedido volvió a la persona 1.'], ['data-pedcer', 'cerrarPedido', 'Pedido cerrado.']].forEach(function (k) {
    Array.prototype.forEach.call(document.querySelectorAll('[' + k[0] + ']'), function (b) {
      b.onclick = function () { if (BUSY) return; busy(true); call(k[1], TOKEN, b.getAttribute(k[0])).then(function () { busy(false); LAST_STATE = ''; toast(k[2]); return load(); }).catch(function (err) { busy(false); toast(errMsg(err), true); }); };
    });
  });
  var ps = $('#plantSi'); if (ps) ps.onclick = function () { PLANTAR = true; render(); var i = $('#pl2'); if (i) i.focus(); };
  var pn = $('#plantNo'); if (pn) pn.onclick = function () { PLANTAR = false; render(); };
  var pf2 = $('#plantForm');
  if (pf2) pf2.onsubmit = function (e) {
    e.preventDefault(); if (BUSY) return; busy(true);
    call('plantarArbol', TOKEN, $('#pl2').value, $('#pl3').value).then(function (res) {
      busy(false);
      var err = res.errores && res.errores.length;
      toast(err ? 'Plantaste la semilla, pero hubo un problema: ' + res.errores.join(' · ') : 'Plantaste una semilla nueva y convocaste a dos personas.', !!err);
      return switchTree(res.arbol);
    }).catch(function (err) { busy(false); toast(errMsg(err), true); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-aceptar]'), function (b) {
    b.onclick = function () {
      if (BUSY) return; busy(true); var id = b.getAttribute('data-aceptar');
      call('aceptarEnApp', TOKEN, id).then(function () { busy(false); INV = ''; toast('Listo, ya estás en el árbol.'); return switchTree(id); }).catch(function (err) { busy(false); toast(errMsg(err), true); });
    };
  });
  var tf = $('#temaForm');
  if (tf) tf.onsubmit = function (e) {
    e.preventDefault(); if (BUSY) return;
    var tipo = document.querySelector('input[name="tTipo"]:checked');
    busy(true);
    call('proponerTema', TOKEN, ARBOL, $('#tTema').value, tipo ? tipo.value : '', $('#tLugar').value).then(function (res) { busy(false); PROP = false; LAST_STATE = ''; toast(res.acordado ? '¡Tema acordado!' : 'Propuesta enviada. Falta que las otras personas de la semilla estén de acuerdo.'); return load(); }).catch(function (err) { busy(false); toast(errMsg(err), true); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('input[name="tTipo"]'), function (r) {
    r.onchange = function () { var geo = r.value === 'Geográfico' && r.checked, box = $('#lugarBox'), li = $('#tLugar'); if (box) box.hidden = !geo; if (li) { li.required = geo; if (geo) li.focus(); } };
  });

  var tno = $('#temaNo'); if (tno) tno.onclick = function () { PROP = false; render(); };
  var tot = $('#temaOtro'); if (tot) tot.onclick = function () { PROP = true; render(); var i = $('#tTema'); if (i) i.focus(); };
  var tok = $('#temaOk'); if (tok) tok.onclick = function () {
    if (BUSY) return; busy(true);
    call('acordarTema', TOKEN, ARBOL).then(function (res) { busy(false); LAST_STATE = ''; toast(res.acordado ? '¡Tema acordado! Ya se pueden abrir las tríadas siguientes.' : 'Listo, quedó registrado tu acuerdo.'); return load(); }).catch(function (err) { busy(false); toast(errMsg(err), true); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-resend]'), function (b) {
    b.onclick = function () { if (BUSY) return; busy(true); call('reenviarInvitacion', TOKEN, ARBOL, b.getAttribute('data-resend')).then(function () { busy(false); toast('Convocatoria reenviada'); }).catch(function (err) { busy(false); toast(errMsg(err), true); }); };
  });
}
// Si se abrió desde el botón de un aviso, entra como quien recibió el correo (aunque hubiera otra sesión abierta).
window.addEventListener('storage', function (e) {
  if (e.key === 'wm_red_token' && e.newValue && e.newValue !== TOKEN) { TOKEN = e.newValue; LOGIN = null; LAST_STATE = ''; load(); }
});
function start() {
  if (CONF && lsGet('wm_conf_used') !== CONF) {
    lsSet('wm_conf_used', CONF);
    return call('confirmarPedido', CONF).then(function (res) { if (res.arbol) ARBOL = res.arbol; return load().then(function () { toast('Listo, ' + (res.nombre || '').split(' ')[0] + ': tu pedido llegó a la persona 1 del árbol.'); }); })
      .catch(function (e) { return load().then(function () { toast(errMsg(e), true); }); });
  }
  if (ACC && lsGet('wm_acc_used') !== ACC) {
    return call('entrarConEnlace', ACC).then(function (res) {
      if (res.necesitaNombre) { ACCN = res; LAST_STATE = ''; return load().then(function () { var n = $('#nameIn'); if (n) n.focus(); }); }
      lsSet('wm_acc_used', ACC);
      if (TOKEN && TOKEN !== res.token) call('cerrarSesion', TOKEN).catch(function () {});
      TOKEN = res.token; lsSet('wm_red_token', TOKEN); LOGIN = null; INV = ''; if (res.arbol) ARBOL = res.arbol;
      return load().then(function () { toast('Entraste como ' + res.nombre); });
    }).catch(function (e) {
      lsSet('wm_acc_used', ACC);
      return load().then(function () { if (!S || !S.yo) toast(errMsg(e), true); });
    });
  }
  return load();
}
start();
setInterval(function () { if (!BUSY && !MDRAG && !document.hidden && !(document.activeElement && document.activeElement.tagName === 'INPUT')) load(); }, 20000);
</script>
